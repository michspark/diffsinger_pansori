# acoustic · hybrid lyrics (03c) + SOFA alignment — the treatment arm of the lyrics A/B
#
# Against ac_sofa the ONLY difference is the .lab text: 03c_hybrid_lyrics.py borrows
# changbon syllables without changing how many Whisper heard, so both corpora hold the
# same 26,955 utterances and the same hold-out. 6,979 of them (25.9%) differ in ph_seq;
# the other 19,976 are the control group.
#
# max_updates and num_ckpt_keep are ac_sofa's, unchanged — a different budget would train
# one arm further than the other and tilt the comparison.

base_config:
  - configs/pansori/acoustic.yaml
  - configs/pansori/data_hyb.yaml

binary_data_dir: data/pansori_hyb/binary_acoustic
max_updates: 40000
num_ckpt_keep: 12
