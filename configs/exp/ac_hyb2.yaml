# acoustic · hybrid lyrics (03c) aligned by the SOFA fitted to them — the treatment arm
# of the lyrics A/B.
#
# Paired with ac_sofa, and the pairing is exact: both corpora hold the same 26,955
# utterances (set difference 0 either way), the same 23 speakers with the same spk_ids and
# the same hold-out songs, and the same audio — 08_export ran with
# `--wavs_from data/pansori_sofa`, so the wavs are symlinks to the very files the other arm
# trains on.
#
# What differs is the whole label-making path, deliberately: this arm's text comes from
# 03c_hybrid_lyrics.py and its timings from ~/src/SOFA/ckpt/korean_pansori_hyb (bootstrapped
# off that text), while ac_sofa's text is Whisper's and its timings come from
# ~/src/SOFA/ckpt/korean_pansori (bootstrapped off Whisper's). So the question this A/B
# answers is "which lyric source, together with an aligner fitted to it, trains a better
# model" — not "which lyric source", which no single run can isolate. docs/LYRICS_AB.md §7.
#
# max_updates and num_ckpt_keep are ac_sofa's, unchanged — a different budget would train
# one arm further than the other and tilt the comparison.

base_config:
  - configs/pansori/acoustic.yaml
  - configs/pansori/data_hyb2.yaml

binary_data_dir: data/pansori_hyb2/binary_acoustic
max_updates: 40000
num_ckpt_keep: 12
