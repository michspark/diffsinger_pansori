# acoustic · SOFA alignment (the treatment arm of the aligner A/B)
#
# Against the MFA arm (ac_v1): the 0.03 s floor rate goes 36.8% -> 19.9% (-46%), and 1s+
# silence 1.29s -> 0.08s (sample of 288 utterances). Breath (AP) is genuinely labelled, so
# make_configs drops merged_phoneme_groups automatically.
#
# max_updates: ac_v1 ran 100k, but its validation minimum was at 28k and the other 72k
# merely burned three GPU-hours (docs/NEXT.md A1). Cut to 40k with num_ckpt_keep raised so
# the optimum survives.

base_config:
  - configs/pansori/acoustic.yaml
  - configs/pansori/data_sofa.yaml

binary_data_dir: data/pansori_sofa/binary_acoustic
max_updates: 40000
num_ckpt_keep: 12
