<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>학습 지표 비교</title>
<style>
:root{
  --paper:#fcfcfb; --card:#fff; --ink:#1a1a1c; --dim:#5d5d66; --mute:#8b8b95;
  --line:#e4e2dd; --grid:#eeece7; --a:#3b5ba5; --b:#b5533c; --sig:#1f7a3f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131416; --card:#1b1c1f; --ink:#eceaf0; --dim:#a3a2ad; --mute:#75747f;
    --line:#2c2d32; --grid:#26272b; --a:#6b8cd4; --b:#d07a55; --sig:#4caf70;
  }
}
:root[data-theme="dark"]{
  --paper:#131416; --card:#1b1c1f; --ink:#eceaf0; --dim:#a3a2ad; --mute:#75747f;
  --line:#2c2d32; --grid:#26272b; --a:#6b8cd4; --b:#d07a55; --sig:#4caf70;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
     font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:40px 20px 80px}
.eyebrow{font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;
         text-transform:uppercase;color:var(--mute);margin-bottom:14px}
h1{font-size:30px;line-height:1.25;margin:0 0 12px;letter-spacing:-.02em}
.lede{color:var(--dim);margin:0 0 8px}
h2{font-size:17px;margin:44px 0 4px;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:13px;margin:0 0 18px}
.legend{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:0 0 18px;font-size:13px}
.legend span{display:flex;gap:7px;align-items:center;color:var(--dim)}
.legend i{width:18px;height:3px;border-radius:2px;display:inline-block}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;
       padding:16px 14px 8px;margin-bottom:14px}
.panel h3{margin:0 0 2px;font-size:14px;font-weight:600}
.panel .cap{margin:0 0 6px;font-size:12px;color:var(--mute)}
svg{display:block;width:100%;height:auto;overflow:visible}
.gl{stroke:var(--grid);stroke-width:1}
.ax{fill:var(--mute);font:11px ui-monospace,SFMono-Regular,Menlo,monospace}
.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.dot{stroke:var(--card);stroke-width:2}
.bestring{fill:none;stroke-width:2}
.bestlab{font:600 10px ui-monospace,Menlo,monospace}
.hit{fill:transparent;cursor:crosshair}
.cross{stroke:var(--mute);stroke-width:1;stroke-dasharray:3 3;opacity:0}
.tip{position:fixed;pointer-events:none;opacity:0;transition:opacity .08s;z-index:9;
     background:var(--card);border:1px solid var(--line);border-radius:9px;
     padding:8px 11px;font-size:12px;box-shadow:0 6px 24px rgba(0,0,0,.13)}
.tip b{display:block;font:600 11px ui-monospace,Menlo,monospace;color:var(--mute);margin-bottom:5px}
.tip div{display:flex;gap:9px;align-items:center;justify-content:space-between;line-height:1.7}
.tip i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto}
.tip .v{font-variant-numeric:tabular-nums;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
thead th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600}
tr.g td{background:transparent;color:var(--mute);font:600 11px ui-monospace,Menlo,monospace;
        letter-spacing:.06em;text-transform:uppercase;padding-top:16px;border-bottom:none}
td.num{font-variant-numeric:tabular-nums}
tr.sig td{background:color-mix(in oklab,var(--sig) 9%,transparent)}
tr.sig td:first-child::after{content:" ·  p<.05";font:600 10px ui-monospace,Menlo,monospace;color:var(--sig)}
.note{color:var(--dim);font-size:13.5px;margin:14px 0 0}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.links a{font-size:13px;color:var(--ink);text-decoration:none;border:1px solid var(--line);
         background:var(--card);border-radius:8px;padding:7px 12px}
.links a:hover{border-color:var(--mute)}
.win{font-variant-numeric:tabular-nums}
</style></head><body>
<div class="wrap">
  <div class="eyebrow">pansori · lyrics A/B on the SOFA aligner</div>
  <h1 id="h1"></h1>
  <p class="lede" id="lede"></p>

  <div class="legend" id="legend"></div>
  <h2>학습 곡선</h2>
  <p class="sub">검증 손실. step 0(학습 전 sanity check)은 뺐다 — 그 값이 이후 곡선을 눌러 버린다.
     동그라미는 <b>실제로 평가에 쓴 체크포인트</b>다.</p>
  <div id="panels"></div>
  <p class="note" id="curvenote"></p>

  <h2>합성 결과 — 짝지은 A/B</h2>
  <p class="sub" id="absub"></p>
  <table id="ab"></table>
  <p class="note" id="abnote"></p>

  <h2>바로 가기</h2>
  <div class="links" id="links"></div>
</div>

<div class="tip" id="tip"></div>
<script>
const DATA = "__PAYLOAD__";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L = DATA.labels, C = DATA.colors;

$('#h1').textContent = `${L.a} 라벨 대 ${L.b} 라벨`;
$('#lede').textContent =
  '정렬기(SOFA)와 그 체크포인트, 오디오, hold-out, 설정을 모두 고정하고 .lab 텍스트만 바꾼 두 학습을 '
  + '나란히 놓는다. 두 코퍼스의 발화 집합은 26,955개로 완전히 같고, 그중 6,979개(25.9%)만 음소열이 다르다.';
$('#legend').innerHTML = [['a', L.a], ['b', L.b]]
  .map(([k, n]) => `<span><i style="background:${C[k]}"></i>${esc(n)}</span>`).join('');

// ── line panels
const W = 760, H = 210, M = {t: 14, r: 16, b: 26, l: 48};
DATA.panels.forEach((p, pi) => {
  const xs = p.a.points.map(d => d[0]).concat(p.b.points.map(d => d[0]));
  const ys = p.a.points.map(d => d[1]).concat(p.b.points.map(d => d[1]));
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = (y1 - y0) * 0.18 || Math.abs(y1) * 0.1 || 1;
  y0 -= pad; y1 += pad;
  const X = v => M.l + (v - x0) / (x1 - x0 || 1) * (W - M.l - M.r);
  const Y = v => M.t + (1 - (v - y0) / (y1 - y0 || 1)) * (H - M.t - M.b);

  const ticks = [];
  for (let s = 0; s <= x1; s += 8000) if (s >= x0) ticks.push(s);
  const yticks = [y0 + pad, (y0 + y1) / 2, y1 - pad];

  const path = pts => pts.map((d, i) => `${i ? 'L' : 'M'}${X(d[0]).toFixed(1)},${Y(d[1]).toFixed(1)}`).join('');
  const marks = (arm, key) => {
    const b = arm.best;
    if (!b) return '';
    const hit = arm.points.find(d => d[0] === b);
    if (!hit) return '';
    return `<circle class="bestring" cx="${X(b)}" cy="${Y(hit[1])}" r="7" stroke="${C[key]}"/>`
         + `<text class="bestlab" x="${X(b)}" y="${Y(hit[1]) - 13}" fill="${C[key]}" text-anchor="middle">${b / 1000}k</text>`;
  };

  const el = document.createElement('div');
  el.className = 'panel';
  el.innerHTML = `<h3>${esc(p.title)}</h3><p class="cap">낮을수록 좋다</p>
    <svg viewBox="0 0 ${W} ${H}" data-panel="${pi}" role="img"
         aria-label="${esc(p.title)} — ${esc(L.a)} 대 ${esc(L.b)}">
      ${yticks.map(v => `<line class="gl" x1="${M.l}" x2="${W - M.r}" y1="${Y(v)}" y2="${Y(v)}"/>
        <text class="ax" x="${M.l - 8}" y="${Y(v) + 4}" text-anchor="end">${v.toFixed(p.digits)}</text>`).join('')}
      ${ticks.map(s => `<text class="ax" x="${X(s)}" y="${H - 8}" text-anchor="middle">${s / 1000}k</text>`).join('')}
      <path class="ln" d="${path(p.a.points)}" stroke="${C.a}"/>
      <path class="ln" d="${path(p.b.points)}" stroke="${C.b}"/>
      ${p.a.points.map(d => `<circle class="dot" cx="${X(d[0])}" cy="${Y(d[1])}" r="3.5" fill="${C.a}"/>`).join('')}
      ${p.b.points.map(d => `<circle class="dot" cx="${X(d[0])}" cy="${Y(d[1])}" r="3.5" fill="${C.b}"/>`).join('')}
      ${marks(p.a, 'a')}${marks(p.b, 'b')}
      <line class="cross" y1="${M.t}" y2="${H - M.b}"/>
      <rect class="hit" x="${M.l}" y="${M.t}" width="${W - M.l - M.r}" height="${H - M.t - M.b}"/>
    </svg>`;
  $('#panels').append(el);

  const svg = el.querySelector('svg'), cross = el.querySelector('.cross'), tip = $('#tip');
  const steps = [...new Set(p.a.points.map(d => d[0]))].sort((m, n) => m - n);
  svg.querySelector('.hit').addEventListener('pointermove', ev => {
    const r = svg.getBoundingClientRect();
    const vx = (ev.clientX - r.left) / r.width * W;
    const step = steps.reduce((best, s) => Math.abs(X(s) - vx) < Math.abs(X(best) - vx) ? s : best, steps[0]);
    const va = (p.a.points.find(d => d[0] === step) || [])[1];
    const vb = (p.b.points.find(d => d[0] === step) || [])[1];
    cross.setAttribute('x1', X(step)); cross.setAttribute('x2', X(step));
    cross.style.opacity = 1;
    tip.innerHTML = `<b>step ${step.toLocaleString()}</b>`
      + [[L.a, va, C.a], [L.b, vb, C.b]].filter(([, v]) => v != null)
        .map(([n, v, c]) => `<div><span><i style="background:${c}"></i> ${esc(n)}</span>`
                          + `<span class="v">${v.toFixed(p.digits)}</span></div>`).join('');
    tip.style.opacity = 1;
    tip.style.left = Math.min(ev.clientX + 14, innerWidth - 190) + 'px';
    tip.style.top = (ev.clientY - 12) + 'px';
  });
  svg.querySelector('.hit').addEventListener('pointerleave', () => {
    cross.style.opacity = 0; $('#tip').style.opacity = 0;
  });
});

$('#curvenote').innerHTML =
  '두 곡선을 <b>높다/낮다로 비교하면 안 된다</b> — 각자 자기 라벨에 대해 계산한 값이라 서로 다른 잣대다. '
  + '여기서 읽을 것은 수렴 모양과 최소점이 언제 오는가이고, 어느 쪽이 나은지는 아래 합성 비교가 정한다.';

// ── A/B table
if (DATA.ab.length) {
  $('#absub').textContent = `hold-out ${DATA.ab.reduce((s, g) => s + g.n, 0)}쌍 × ${DATA.abSeeds}시드, `
    + '2_resynth 단(실제 ph_dur·실제 f0 → mel). 시드 중앙값에 부호검정.';
  const t = $('#ab');
  t.innerHTML = `<thead><tr><th>지표</th><th>${esc(L.a)}</th><th>${esc(L.b)}</th>`
    + `<th>${esc(L.b)} 승</th><th>p</th></tr></thead><tbody></tbody>`;
  const tb = t.querySelector('tbody');
  DATA.ab.forEach(g => {
    tb.insertAdjacentHTML('beforeend', `<tr class="g"><td colspan="5">${esc(g.label)} — ${g.n}쌍</td></tr>`);
    g.rows.forEach(r => {
      tb.insertAdjacentHTML('beforeend',
        `<tr class="${r.p < 0.05 ? 'sig' : ''}"><td>${esc(r.metric)}</td>`
        + `<td class="num">${r.a.toFixed(r.digits)}</td>`
        + `<td class="num">${r.b.toFixed(r.digits)}</td>`
        + `<td class="num win">${r.bWins}/${r.pairs}</td>`
        + `<td class="num">${r.p.toFixed(3)}</td></tr>`);
    });
  });
  $('#abnote').innerHTML =
    '대조군은 두 코퍼스에서 음소열이 글자 하나 다르지 않은 발화다. 학습 런 사이의 우연한 차이는 '
    + '양쪽 군에 똑같이 나타나므로, <b>처치군에만 나타나는 차이</b>만 가사 탓으로 돌릴 수 있다.';
}

// ── links
$('#links').innerHTML = `<a href="${DATA.project}">wandb 프로젝트</a>`
  + Object.entries(DATA.runs).map(([n, u]) => `<a href="${u}">${esc(n)}</a>`).join('');
</script>
</body></html>
