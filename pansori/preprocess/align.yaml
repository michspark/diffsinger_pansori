# Stage 4 정렬기 설정.
#
# MFA 는 음성용 HMM-GMM 이라 판소리의 긴 지속모음에서 무너진다 — 정렬기 원본
# TextGrid 기준 음소의 34.03% 가 0.03초 하한선에 박혀 있고 (pansori/docs/LYRICBOOK_VERDICT.md:70),
# 06_merge 가 흡수하는 "무음인데 노트가 있는" 구간이 코퍼스 시간의 52.2% 다.
# SOFA 는 노래 전용이고 이 코퍼스로 직접 파인튜닝할 수 있다. 두 정렬기를 같은
# 파이프라인에 걸어 두고 실측으로 고르기 위한 스위치가 아래 `aligner` 한 줄이다.
#
# 두 백엔드 모두 aligned{suffix}/*.TextGrid 를 남기므로 하류는 아무것도 모른다.
# 04_align.py --aligner 로 이 파일을 덮어쓸 수 있다.

aligner: sofa           # mfa | sofa

# 정렬 가능한 최소 한글 글자 수. 이보다 짧은 발화는 두 백엔드 모두 건너뛴다 —
# 같은 값을 쓰지 않으면 두 팔의 발화 집합이 달라져 A/B 가 성립하지 않는다.
min_hangul: 2

mfa:
  # `aligner` env 에 설치된 모델 이름 (mfa model download 로 받은 것).
  acoustic: korean_mfa
  dictionary: korean_mfa

sofa:
  # https://github.com/qiuqiao/SOFA — 이 저장소 밖에 clone 해 두고 여기서 가리킨다.
  # SOFA 는 torch 가 필요하고 aligner env 는 py3.14 + MFA 라 같이 살 수 없다.
  root: ~/src/SOFA
  conda_env: sofa
  ckpt: ~/src/SOFA/ckpt/korean_pansori/best/5000-5.9491.ckpt

  # SOFA 의 DictionaryG2P 는 사전 값을 그대로 음소로 쓴다. 즉 학습·추론에 쓰는
  # 바로 그 사전을 주면 IPA→Coda 변환 단계 자체가 사라진다.
  dictionary: dictionaries/korean-coda.txt

  # .lab 토큰 단위. SOFA 의 words 티어는 .lab 토큰 그대로이고, DictionaryG2P 는
  # 모든 word 뒤에 SP 를 무조건 삽입한다.
  #   syllable — words = 음절. 06_merge 의 어절→음절 재분할이 공짜로 해결되지만
  #              음절마다 SP 슬롯이 생긴다.
  #   eojeol   — words = 어절, SP 는 어절 경계에만. MFA 와 같은 모양.
  #              korean-coda.txt 에서 어절 사전을 합성해 쓴다.
  lab_unit: syllable

  mode: force                                     # force | match (-m)
  ap_detector: LoudnessSpectralcentroidAPDetector  # breath_ap 를 켜면 무시된다

# FoxBreatheLabeler — https://github.com/autumn-DL/FoxBreatheLabeler
# SOFA 가 낸 TextGrid 의 SP 구간 위에만 AP(들숨) 를 덧씌운다. 켜면 SOFA 는
# NoneAPDetector 로 강제된다 (FBL 은 AP 가 없는 tg 위에서만 동작한다).
# AP 가 실제로 라벨되면 make_configs.py 가 merged_phoneme_groups 를 자동으로 뺀다.
breath_ap:
  enabled: false
  root: ~/src/FoxBreatheLabeler
  conda_env: fbl
  ckpt: ~/src/FoxBreatheLabeler/models/model_ckpt_steps_7000.ckpt
  ap_threshold: 0.4     # 들숨 확률 판정 문턱
  ap_dur: 0.08          # 이보다 짧은 들숨은 버린다 (초)
  sp_dur: 0.1           # 이보다 짧은 SP 는 옆 AP 에 흡수된다 (초)
